<!doctype html>
<!-- Landing page at the root of GitHub Pages. The workflow copies this file to
     _site/index.html; each talk is published in its own folder next to it. Add
     a new <li> here when a new talk folder is added to the repo. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wind analysis and machine learning in Autodesk Forma</title>
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('women-engineering-forma/fonts/Inter-latin.woff2') format('woff2');
      font-weight: 100 900;
    }
    :root { --ink: #000; --muted: #666; --rule: #DDD; --accent: #0696D7; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--ink);
      background: #fff;
    }
    main { max-width: 760px; margin: 0 auto; padding: 72px 32px; }
    h1 { font-size: 2.2rem; letter-spacing: -0.02em; margin: 0 0 0.3em; }
    p.lead { color: var(--muted); margin: 0 0 2.5em; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border-top: 1px solid var(--rule); padding: 1.3em 0; }
    li:last-child { border-bottom: 1px solid var(--rule); }
    .meta {
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--accent);
    }
    h2 { font-size: 1.35rem; margin: 0.25em 0 0.4em; }
    a { color: var(--ink); }
    .links a { margin-right: 1.2em; color: var(--accent); text-decoration: none; font-weight: 500; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<main>
  <h1>Wind analysis and machine learning in Autodesk Forma</h1>
  <p class="lead">Slides from talks by Vilde and Sunniva.</p>

  <ul>
    <li>
      <div class="meta">November 17, 2026 · English</div>
      <h2>Women engineering Forma</h2>
      <div class="links">

        <a href="women-engineering-forma/slides.pdf">PDF</a>
      </div>
    </li>
    <li>
      <div class="meta">September 24, 2026 · Norwegian</div>
      <h2>Jenter i AI</h2>
      <div class="links">
        <a href="jenter-i-ai/">Slides</a>
        <a href="jenter-i-ai/slides.pdf">PDF</a>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
