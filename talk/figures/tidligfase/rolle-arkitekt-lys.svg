<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 220" role="img"
     aria-label="Figur av en arkitekt med beret">
  <!-- Lys utgave av rolle-arkitekt.svg, laget for slidene som ligger på
       flyfotoet. Den mørkegrå kroppen (#3D3D3D) forsvant mot trekroner og
       asfalt — på et foto er mørkt mot mørkt. Nesten hvit kropp med mørk
       kontur leses overalt, også der figuren står på en lys flate.

       Konturen er trukket 1,3 enheter inn fra ytterkanten, ellers ville
       nederste strek blitt halvveis klippet av viewBoxen. Silhuetten er
       praktisk talt den samme som i den mørke utgaven, så de to kan byttes
       uten at figuren hopper. -->
  <g fill="#F4F4F4" stroke="#23262A" stroke-width="2.6" stroke-linejoin="round">
    <circle cx="70" cy="50" r="28.7"/>
    <path d="M17.3 218.7 v-84.7 a52.7 52.7 0 0 1 105.4 0 v84.7 Z"/>
  </g>

  <!-- Baskeren: flat skive på skrå, knotten i den høye enden. Samme røde som i
       den mørke utgaven — den leses mot både lys kropp og mørkt foto. -->
  <g fill="#C43D2E" stroke="#23262A" stroke-width="2.2">
    <ellipse cx="70" cy="27" rx="42" ry="14" transform="rotate(-13 70 27)"/>
    <circle cx="98" cy="13" r="6"/>
  </g>
</svg>
