<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 304" role="img"
     aria-label="Piler som peker inn mot tomta fra åtte vindretninger, merket nord, øst, sør og vest">
  <!-- Kort 1 på «Hvordan beregner vi vindkomfort?»: simuleringen kjøres én gang
       per vindretning. Tegnet i plan og ikke isometrisk — de åtte retningene er
       poenget, og i plan er de like lange og like tydelige hele veien rundt.

       Pilene peker INN mot tomta: de viser hvor vinden kommer FRA, som er måten
       vindretninger oppgis på. Halene ligger på samme radius (130) hele veien
       rundt, så ingen retning ser viktigere ut enn de andre. Pilene er korte og
       tynne med vilje: tomta i midten er motivet, pilene er bare skiltingen
       rundt den.

       viewBoxen er KVADRATISK, og det er den fordi .recipe .thumb i sliden er
       det. Var den ikke det, ville preserveAspectRatio skalert ned innholdet
       for å få det til å passe i boksen — og da krymper ringen under
       flyfotoet, som skaleres av CSS og ikke av SVG-en.

       Midten er TOM med vilje. Selve tomta er et eget <img> i sliden
       (gløshaugenfromabove-utsnitt.png), klippet til sirkel og lagt UNDER denne
       fila — en ekstern PNG referert inne i en SVG som lastes via <img> blir
       ikke hentet av nettleseren, så komposisjonen må skje i sliden. Ringen her
       er kanten på det bildet: r er 92 av 304, altså 60,5 % av boksen i
       diameter, og det er tallet .thumb.dirs img.site i sliden gjentar. Endrer
       du r, må prosenten der følge etter.

       Bare N, Ø, S og V er skrevet på. De fire diagonalene har piler, men ingen
       tekst: åtte merkelapper i en miniatyr blir uleselige fra salen, og de
       fire hovedretningene er nok til at rosen ved siden av kan leses. -->
  <g fill="none" stroke="#9A9A9A" stroke-width="1.6">
    <circle cx="152" cy="152" r="92"/>
  </g>
  <g stroke="#000000" stroke-width="2.4" stroke-linecap="butt">
    <line x1="152.0" y1="282.0" x2="152.0" y2="263.0"/>
    <polygon points="152.0,252.0 145.5,263.0 158.5,263.0" stroke="none" fill="#000000"/>
    <line x1="60.1" y1="243.9" x2="73.5" y2="230.5"/>
    <polygon points="81.3,222.7 68.9,225.9 78.1,235.1" stroke="none" fill="#000000"/>
    <line x1="22.0" y1="152.0" x2="41.0" y2="152.0"/>
    <polygon points="52.0,152.0 41.0,145.5 41.0,158.5" stroke="none" fill="#000000"/>
    <line x1="60.1" y1="60.1" x2="73.5" y2="73.5"/>
    <polygon points="81.3,81.3 78.1,68.9 68.9,78.1" stroke="none" fill="#000000"/>
    <line x1="152.0" y1="22.0" x2="152.0" y2="41.0"/>
    <polygon points="152.0,52.0 158.5,41.0 145.5,41.0" stroke="none" fill="#000000"/>
    <line x1="243.9" y1="60.1" x2="230.5" y2="73.5"/>
    <polygon points="222.7,81.3 235.1,78.1 225.9,68.9" stroke="none" fill="#000000"/>
    <line x1="282.0" y1="152.0" x2="263.0" y2="152.0"/>
    <polygon points="252.0,152.0 263.0,158.5 263.0,145.5" stroke="none" fill="#000000"/>
    <line x1="243.9" y1="243.9" x2="230.5" y2="230.5"/>
    <polygon points="222.7,222.7 225.9,235.1 235.1,225.9" stroke="none" fill="#000000"/>
  </g>
  <!-- Merkelappene ligger rett utenfor pilhalen de hører til: N over den øverste,
       S under den nederste, Ø og V på hver side. -->
  <g font-family="'Artifakt Element','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#000000">
    <text x="152" y="16" text-anchor="middle">N</text>
    <text x="152" y="300" text-anchor="middle">S</text>
    <text x="290" y="158" text-anchor="start">Ø</text>
    <text x="14" y="158" text-anchor="end">V</text>
  </g>
</svg>
