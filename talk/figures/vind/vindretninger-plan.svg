<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 200" role="img"
     aria-label="Tomta sett ovenfra, med piler som peker inn mot den fra åtte vindretninger, merket nord, øst, sør og vest">
  <!-- Kort 1 på «Hvordan beregner vi vindkomfort?»: simuleringen kjøres én gang
       per vindretning. Tegnet i plan og ikke isometrisk — de åtte retningene er
       poenget, og i plan er de like lange og like tydelige hele veien rundt.

       Pilene peker INN mot tomta: de viser hvor vinden kommer FRA, som er måten
       vindretninger oppgis på. Halene ligger på samme radius (78) hele veien
       rundt, så ingen retning ser viktigere ut enn de andre.

       Bare N, Ø, S og V er skrevet på. De fire diagonalene har piler, men ingen
       tekst: åtte merkelapper i en 282 px bred miniatyr blir uleselige fra
       salen, og de fire hovedretningene er nok til at rosen kan leses. Halene
       er korta ned fra 92 til 78 for å gi plass til teksten utenfor dem.

       Palett som modell-cfd.svg og modell-surrogat.svg: svart kontur, grå
       flater. Formatet er 1,52:1, samme som komfortkartet på kort 3, så de tre
       miniatyrene fyller like store bokser. -->
  <g fill="#E4E4E4" stroke="#9A9A9A" stroke-width="1.6">
    <circle cx="152" cy="100" r="38"/>
  </g>
  <g fill="#FFFFFF" stroke="#000000" stroke-width="1.8" stroke-linejoin="round">
    <rect x="126" y="81" width="28" height="14" rx="1.5"/>
    <rect x="160" y="96" width="13" height="23" rx="1.5"/>
    <rect x="128" y="105" width="18" height="11" rx="1.5"/>
  </g>
  <g stroke="#000000" stroke-width="3" stroke-linecap="butt">
    <line x1="152.0" y1="178.0" x2="152.0" y2="156.0"/>
    <polygon points="152.0,145.0 145.0,156.0 159.0,156.0" stroke="none" fill="#000000"/>
    <line x1="96.8" y1="155.2" x2="112.4" y2="139.6"/>
    <polygon points="120.2,131.8 107.5,134.6 117.4,144.5" stroke="none" fill="#000000"/>
    <line x1="74.0" y1="100.0" x2="96.0" y2="100.0"/>
    <polygon points="107.0,100.0 96.0,93.0 96.0,107.0" stroke="none" fill="#000000"/>
    <line x1="96.8" y1="44.8" x2="112.4" y2="60.4"/>
    <polygon points="120.2,68.2 117.4,55.5 107.5,65.4" stroke="none" fill="#000000"/>
    <line x1="152.0" y1="22.0" x2="152.0" y2="44.0"/>
    <polygon points="152.0,55.0 159.0,44.0 145.0,44.0" stroke="none" fill="#000000"/>
    <line x1="207.2" y1="44.8" x2="191.6" y2="60.4"/>
    <polygon points="183.8,68.2 196.5,65.4 186.6,55.5" stroke="none" fill="#000000"/>
    <line x1="230.0" y1="100.0" x2="208.0" y2="100.0"/>
    <polygon points="197.0,100.0 208.0,107.0 208.0,93.0" stroke="none" fill="#000000"/>
    <line x1="207.2" y1="155.2" x2="191.6" y2="139.6"/>
    <polygon points="183.8,131.8 186.6,144.5 196.5,134.6" stroke="none" fill="#000000"/>
  </g>
  <!-- Merkelappene ligger rett utenfor pilhalen de hører til: N over den øverste,
       S under den nederste, Ø og V på hver side. -->
  <g font-family="'Artifakt Element','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#000000">
    <text x="152" y="16" text-anchor="middle">N</text>
    <text x="152" y="195" text-anchor="middle">S</text>
    <text x="240" y="105" text-anchor="start">Ø</text>
    <text x="64" y="105" text-anchor="end">V</text>
  </g>
</svg>
