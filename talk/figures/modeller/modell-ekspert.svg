<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img"
     aria-label="Ikon for den innleide vindeksperten: en innlevert rapport">
  <!-- Tredje ikon i stigen, ved siden av mesh-kuben og nett-ikonet. Motivet er
       LEVERANSEN og ikke personen: det konsulenten ga fra seg var en rapport,
       én gang, sent. Et menneskehode ville sagt «ekspert», men ikke «du ventet
       på et dokument».
       Grått og ikke svart: kortet det står i er fortiden, og theme.css toner
       hele det kortet ned til muted-grått. Et svart ikon ville vært det
       eneste fullfargede på et grått kort.
       Samme 120x120-rute og samme strektykkelser som modell-cfd.svg, slik at
       de tre ikonene leses som ett sett. -->
  <g stroke="#7A7A7A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Arket, med brettet hjørne oppe til hoyre. -->
    <path d="M26 16 H74 L94 36 V104 H26 Z" fill="#F2F2F2"/>
    <path d="M74 16 V36 H94" fill="#FFFFFF"/>
  </g>
  <!-- Innholdet: tre tekstlinjer og en vindkurve, i tynn strek som
       delelinjene i mesh-ikonet. -->
  <g stroke="#7A7A7A" stroke-width="1.3" stroke-linecap="round" fill="none">
    <line x1="38" y1="52" x2="82" y2="52"/>
    <line x1="38" y1="62" x2="82" y2="62"/>
    <line x1="38" y1="72" x2="66" y2="72"/>
    <path d="M38 88 C48 80, 58 96, 68 88 S82 80, 84 86"/>
  </g>
</svg>
