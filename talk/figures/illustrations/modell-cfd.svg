<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img"
     aria-label="Ikon for fullverdig CFD: et volumetrisk beregningsnett">
  <!-- Beregningsnettet er den praktiske forskjellen mellom de to modellene:
       CFD må ha et nett, surrogaten trenger det ikke. Tegnet isometrisk og ikke
       flatt, så det leses som et volum og ikke som rutepapir.
       Palett fra 02-surrogat-pipeline.svg: svart kontur, grå delelinjer. -->
  <g stroke="#000000" stroke-width="2.6" stroke-linejoin="round">
    <polygon points="18,42 60,18 102,42 60,66" fill="#FFFFFF"/>
    <polygon points="18,42 60,66 60,100 18,76" fill="#F2F2F2"/>
    <polygon points="60,66 102,42 102,76 60,100" fill="#E4E4E4"/>
  </g>
  <g stroke="#7A7A7A" stroke-width="1.3">
    <line x1="32.0" y1="34.0" x2="74.0" y2="58.0"/>
    <line x1="32.0" y1="50.0" x2="74.0" y2="26.0"/>
    <line x1="46.0" y1="26.0" x2="88.0" y2="50.0"/>
    <line x1="46.0" y1="58.0" x2="88.0" y2="34.0"/>
    <line x1="32.0" y1="50.0" x2="32.0" y2="84.0"/>
    <line x1="18.0" y1="53.3" x2="60.0" y2="77.3"/>
    <line x1="46.0" y1="58.0" x2="46.0" y2="92.0"/>
    <line x1="18.0" y1="64.7" x2="60.0" y2="88.7"/>
    <line x1="74.0" y1="58.0" x2="74.0" y2="92.0"/>
    <line x1="60.0" y1="77.3" x2="102.0" y2="53.3"/>
    <line x1="88.0" y1="50.0" x2="88.0" y2="84.0"/>
    <line x1="60.0" y1="88.7" x2="102.0" y2="64.7"/>
  </g>
</svg>
