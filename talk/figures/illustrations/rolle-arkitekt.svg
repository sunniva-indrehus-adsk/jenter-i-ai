<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 220" role="img"
     aria-label="Figur av en arkitekt med beret">
  <!-- Bare figuren. Snakkeboblen og navnet ligger som HTML oppå i slides.md:
       teksten må kunne brekke og bruke deckets egen skrift, og en SVG lastet
       via <img> når ikke @font-face-en i temaet.
       Mørkegrå kropp, ikke svart — svart ble for hardt mot det lyse sjiktet. -->
  <g fill="#3D3D3D">
    <circle cx="70" cy="50" r="30"/>
    <path d="M16 220 v-86 a54 54 0 0 1 108 0 v86 Z"/>
  </g>

  <!-- Baskeren: flat skive på skrå, knotten i den høye enden. Rød — klassisk baskerfarge, og den
       leses både mot det mørkegrå hodet og mot det lyse sjiktet bak. -->
  <g fill="#C43D2E">
    <ellipse cx="70" cy="27" rx="42" ry="14" transform="rotate(-13 70 27)"/>
    <circle cx="98" cy="13" r="6"/>
  </g>
</svg>
