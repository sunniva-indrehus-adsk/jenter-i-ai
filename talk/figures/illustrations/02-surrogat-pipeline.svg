<!-- Surrogatmodellen: hva som skjer når arkitekten trykker «kjør».

     VERIFISERT MOT spacemakerai/wind-surrogate:
       lib/prediction.py:53-61    predict(): surrogate_input.rotate(-direction)
                                  → nett → rotate_array(prediction, direction).
                                  Retningen er IKKE en inngang til nettet —
                                  geometrien roteres i stedet.
       lib/prediction.py:64-86    predict_comfort(): roterer for alle åtte
                                  retninger, kjører dem som ÉN batch, og vekter
                                  resultatet med vindrosen.
       lib/constants.py:35        WIND_DIRECTIONS = [0,45,...,315] — åtte.
       lib/constants.py:37        GROUND_MEASUREMENT_HEIGHT = 1.75 m.
       lib/constants.py:22-31     site 200x200 px, kontekst 500x500 px, 1,5 m/px
                                  → 300 m prediksjon i 750 m kontekst.
       lib/utils/model.py         ONNX Runtime, assets/latest.onnx.
       lambdas/handler_trigger_data_generation.py
                                  Skanner wind-analysis-backend-prod for CFD-
                                  analyser med status SUCCEEDED og køer dem som
                                  treningseksempler. Treningssettet vokser altså
                                  av produksjonskjøringer — det er ikke et
                                  datasett som ble laget én gang.

     Merkelappen «HOS OSS — LØPENDE» er tatt ut; den stiplede boksen står på egne
     bein, sentrert under nettet. Kickeren «I APPEN — SEKUNDER» er beholdt, den
     bærer fartspoenget.

     Fargene følger theme.css: ink #000, accent #0696D7, muted #6E6E6E, rule #D9D9D9.

     Boksene er 330 brede med 26 px innrykk, altså 278 px innvendig. Blir en
     tekstlinje lengre enn ~260 px, kysser den rammen og figuren ser
     sammenpresset ut — del den i to linjer i stedet for å krympe fonten.

     Forholdet er 2,67:1 med vilje: bredt og lavt, så sliden har plass til en
     callout under uten at noe havner i logoen nede til venstre. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420"
     font-family="'Artifakt Element','Inter','Helvetica Neue',Helvetica,Arial,sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6E6E6E"/>
    </marker>
  </defs>

  <!-- ── Øverste rad: det som skjer i appen, hver gang ──────────────────── -->

  <text x="0" y="24" font-size="19" font-weight="700" letter-spacing="2.6"
        fill="#0696D7">I APPEN — SEKUNDER</text>

  <!-- Inn -->
  <rect x="0" y="50" width="330" height="140" fill="#FFFFFF"
        stroke="#D9D9D9" stroke-width="2"/>
  <rect x="0" y="50" width="330" height="4" fill="#000000"/>
  <text x="26" y="100" font-size="30" font-weight="700" fill="#000000">Inn</text>
  <text x="26" y="136" font-size="20" fill="#6E6E6E">Terreng og bygninger</text>
  <text x="26" y="164" font-size="20" fill="#6E6E6E">som høydekart</text>

  <line x1="346" y1="120" x2="381" y2="120" stroke="#000000" stroke-width="3"
        marker-end="url(#arrow)"/>

  <!-- Modellen -->
  <rect x="395" y="50" width="330" height="140" fill="#0696D7" stroke="#0696D7"
        stroke-width="2"/>
  <text x="421" y="100" font-size="30" font-weight="700" fill="#FFFFFF">Nevralt nett</text>
  <text x="421" y="136" font-size="20" fill="#FFFFFF" opacity="0.9">Geometrien roteres til</text>
  <text x="421" y="164" font-size="20" fill="#FFFFFF" opacity="0.9">hver av åtte vindretninger</text>

  <line x1="741" y1="120" x2="776" y2="120" stroke="#000000" stroke-width="3"
        marker-end="url(#arrow)"/>

  <!-- Ut -->
  <rect x="790" y="50" width="330" height="140" fill="#FFFFFF"
        stroke="#D9D9D9" stroke-width="2"/>
  <rect x="790" y="50" width="330" height="4" fill="#000000"/>
  <text x="816" y="100" font-size="30" font-weight="700" fill="#000000">Ut</text>
  <text x="816" y="136" font-size="20" fill="#6E6E6E">Åtte vindfelt, 1,75 m</text>
  <text x="816" y="164" font-size="20" fill="#6E6E6E">over bakken</text>

  <!-- Vindrosen gjør de åtte feltene om til ett komfortkart. Pila står til
       venstre i boksen, ikke midt i: etiketten til høyre for den må få plass
       innenfor viewBox-en på 1120. -->
  <line x1="838" y1="200" x2="838" y2="246" stroke="#000000" stroke-width="3"
        marker-end="url(#arrow)"/>
  <text x="862" y="238" font-size="20" fill="#6E6E6E">vektet med vindrosen</text>
  <text x="816" y="284" font-size="26" font-weight="700" fill="#000000">Komfortkart</text>

  <!-- ── Nederste rad: treningsdataene ──────────────────────────────────── -->

  <line x1="560" y1="296" x2="560" y2="200" stroke="#6E6E6E" stroke-width="3"
        stroke-dasharray="8 7" marker-end="url(#arrow-muted)"/>
  <text x="582" y="254" font-size="20" fill="#6E6E6E">trening</text>

  <rect x="300" y="300" width="520" height="120" fill="#FFFFFF"
        stroke="#6E6E6E" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="326" y="345" font-size="26" font-weight="700" fill="#000000">Fullverdige CFD-kjøringer</text>
  <text x="326" y="378" font-size="20" fill="#6E6E6E">Ferdige analyser plukkes opp automatisk</text>
  <text x="326" y="402" font-size="20" fill="#6E6E6E">og blir treningseksempler</text>
</svg>
