<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Blue sky behind the landscape, clipped to a rounded rectangle so the picture reads as a framed scene on the white slide. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FB0E5"/>
      <stop offset="1" stop-color="#CFEAF8"/>
    </linearGradient>
    <clipPath id="frame"><rect width="400" height="300" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="400" height="300" fill="url(#sky)"/>
    <g fill="#fff" opacity="0.9">
      <ellipse cx="90" cy="70" rx="34" ry="13"/><ellipse cx="114" cy="60" rx="24" ry="15"/><ellipse cx="70" cy="64" rx="18" ry="11"/>
      <ellipse cx="220" cy="42" rx="26" ry="10"/><ellipse cx="238" cy="35" rx="17" ry="11"/>
    </g>
    <!-- The Forest: many trees, many greens, soft ground. -->
    <defs>
      <g id="pine">
        <rect x="-6" y="-24" width="12" height="26" fill="#6B4A2B"/>
        <polygon points="0,-140 -36,-74 36,-74"/>
        <polygon points="0,-112 -46,-20 46,-20"/>
      </g>
      <g id="round">
        <rect x="-6" y="-40" width="12" height="42" fill="#6B4A2B"/>
        <circle cx="0" cy="-80" r="44"/>
      </g>
    </defs>
    <circle cx="320" cy="64" r="26" fill="#F2C14E"/>
    <path d="M0 236Q200 212 400 236V300H0Z" fill="#A9D18E"/>
    <use href="#pine" transform="translate(70 232) scale(0.8)" fill="#7DBA84"/>
    <use href="#round" transform="translate(160 228) scale(0.85)" fill="#7DBA84"/>
    <use href="#pine" transform="translate(262 228) scale(0.9)" fill="#7DBA84"/>
    <use href="#pine" transform="translate(350 236) scale(0.75)" fill="#7DBA84"/>
    <path d="M0 262Q200 240 400 262V300H0Z" fill="#8BBF7A"/>
    <use href="#round" transform="translate(40 262) scale(0.9)" fill="#3F9A63"/>
    <use href="#pine" transform="translate(118 266) scale(1.05)" fill="#2E7D4F"/>
    <use href="#round" transform="translate(212 264) scale(1)" fill="#5FA777"/>
    <use href="#pine" transform="translate(300 266) scale(1.15)" fill="#2E7D4F"/>
    <use href="#round" transform="translate(372 266) scale(0.8)" fill="#3F9A63"/>
    <path d="M0 284Q200 270 400 284V300H0Z" fill="#6FA85F"/>
  </g>
</svg>
