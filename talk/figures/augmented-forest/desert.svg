<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Blue sky behind the landscape, clipped to a rounded rectangle so the picture reads as a framed scene on the white slide. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7EC3EA"/>
      <stop offset="1" stop-color="#D8EEF8"/>
    </linearGradient>
    <clipPath id="frame"><rect width="400" height="300" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="400" height="300" fill="url(#sky)"/>
    <!-- The Desert: hard sun, bare dunes, one lonely cactus. Flat style, matches forest.svg and genie.svg. -->
    <circle cx="300" cy="82" r="42" fill="#F2C14E"/>
    <g stroke="#F2C14E" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M300 18v-10M300 156v-10M236 82h-10M374 82h-10M255 37l-7-7M352 134l-7-7M255 127l-7 7M352 30l-7 7"/>
    </g>
    <g stroke="#E0B25A" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6">
      <path d="M40 120q10-8 20 0t20 0t20 0"/>
      <path d="M70 140q10-8 20 0t20 0t20 0"/>
    </g>
    <path d="M0 205Q90 150 190 192T400 172V300H0Z" fill="#EBCB8B"/>
    <g fill="#7A9E5A">
      <rect x="104" y="140" width="20" height="96" rx="10"/>
      <rect x="80" y="186" width="34" height="15" rx="7.5"/>
      <rect x="80" y="160" width="15" height="41" rx="7.5"/>
      <rect x="114" y="172" width="32" height="15" rx="7.5"/>
      <rect x="131" y="146" width="15" height="41" rx="7.5"/>
    </g>
    <path d="M0 250Q120 205 260 244T400 232V300H0Z" fill="#D9A752"/>
    <path d="M0 282Q150 256 400 276V300H0Z" fill="#C08A2E"/>
  </g>
</svg>
