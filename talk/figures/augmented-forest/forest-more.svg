<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- The forest after the genie: the same scene, grown dense. Four rows of trees, more greens, and new
       growth in front. Used on "AI intensifies both". -->
  <defs>
    <linearGradient id="sky-f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FB0E5"/>
      <stop offset="1" stop-color="#CFEAF8"/>
    </linearGradient>
    <clipPath id="frame-f"><rect width="400" height="300" rx="14"/></clipPath>
    <g id="pine2">
      <rect x="-6" y="-24" width="12" height="26" fill="#6B4A2B"/>
      <polygon points="0,-140 -36,-74 36,-74"/>
      <polygon points="0,-112 -46,-20 46,-20"/>
    </g>
    <g id="round2">
      <rect x="-6" y="-40" width="12" height="42" fill="#6B4A2B"/>
      <circle cx="0" cy="-80" r="44"/>
    </g>
  </defs>
  <g clip-path="url(#frame-f)">
    <rect width="400" height="300" fill="url(#sky-f)"/>
    <circle cx="340" cy="40" r="22" fill="#F2C14E"/>
    <g fill="#fff" opacity="0.9"><ellipse cx="70" cy="34" rx="26" ry="10"/><ellipse cx="88" cy="27" rx="17" ry="11"/></g>
    <!-- Row 1, far back, palest -->
    <g fill="#A3CF9A">
      <use href="#pine2" transform="translate(20 175) scale(0.7)"/><use href="#round2" transform="translate(70 172) scale(0.7)"/>
      <use href="#pine2" transform="translate(120 175) scale(0.75)"/><use href="#pine2" transform="translate(165 172) scale(0.7)"/>
      <use href="#round2" transform="translate(215 175) scale(0.7)"/><use href="#pine2" transform="translate(262 172) scale(0.75)"/>
      <use href="#round2" transform="translate(310 175) scale(0.7)"/><use href="#pine2" transform="translate(355 172) scale(0.72)"/>
      <use href="#pine2" transform="translate(395 175) scale(0.7)"/>
    </g>
    <path d="M0 196Q200 180 400 196V300H0Z" fill="#B5DA9C"/>
    <!-- Row 2 -->
    <g fill="#7DBA84">
      <use href="#round2" transform="translate(0 214) scale(0.8)"/><use href="#pine2" transform="translate(48 216) scale(0.85)"/>
      <use href="#round2" transform="translate(100 212) scale(0.8)"/><use href="#pine2" transform="translate(148 216) scale(0.9)"/>
      <use href="#pine2" transform="translate(196 212) scale(0.85)"/><use href="#round2" transform="translate(246 216) scale(0.8)"/>
      <use href="#pine2" transform="translate(292 212) scale(0.9)"/><use href="#round2" transform="translate(342 216) scale(0.8)"/>
      <use href="#pine2" transform="translate(392 214) scale(0.85)"/>
    </g>
    <path d="M0 236Q200 220 400 236V300H0Z" fill="#A9D18E"/>
    <!-- Row 3 -->
    <g>
      <use href="#pine2" transform="translate(22 256) scale(1)" fill="#3F9A63"/><use href="#round2" transform="translate(78 254) scale(0.9)" fill="#5FA777"/>
      <use href="#pine2" transform="translate(128 258) scale(1.05)" fill="#2E7D4F"/><use href="#round2" transform="translate(186 254) scale(0.95)" fill="#3F9A63"/>
      <use href="#pine2" transform="translate(240 258) scale(1.1)" fill="#2E7D4F"/><use href="#round2" transform="translate(296 254) scale(0.9)" fill="#5FA777"/>
      <use href="#pine2" transform="translate(348 258) scale(1.05)" fill="#3F9A63"/><use href="#round2" transform="translate(398 256) scale(0.9)" fill="#2E7D4F"/>
    </g>
    <path d="M0 268Q200 254 400 268V300H0Z" fill="#8BBF7A"/>
    <!-- Row 4, front: big trees at the edges, saplings and bushes between -->
    <g>
      <use href="#round2" transform="translate(-10 300) scale(1.1)" fill="#2E7D4F"/>
      <use href="#pine2" transform="translate(410 300) scale(1.25)" fill="#24693F"/>
      <use href="#pine2" transform="translate(105 290) scale(0.45)" fill="#4E9E5E"/>
      <use href="#pine2" transform="translate(205 292) scale(0.5)" fill="#3F9A63"/>
      <use href="#pine2" transform="translate(300 290) scale(0.45)" fill="#4E9E5E"/>
    </g>
    <path d="M0 286Q200 274 400 286V300H0Z" fill="#6FA85F"/>
    <g fill="#5FA777"><circle cx="60" cy="288" r="12"/><circle cx="74" cy="284" r="10"/><circle cx="160" cy="290" r="11"/><circle cx="250" cy="288" r="12"/><circle cx="264" cy="285" r="9"/><circle cx="350" cy="290" r="11"/></g>
    <g fill="#F2C14E"><circle cx="66" cy="281" r="2.5"/><circle cx="256" cy="281" r="2.5"/><circle cx="154" cy="285" r="2.5"/></g>
  </g>
</svg>
