name: Publiser slides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publiser-slides
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest

    steps:
      - name: Hent ut repoet
        uses: actions/checkout@v4

      # Samme image og versjon som README-en bruker lokalt, så CI og maskinen
      # din gir identisk resultat. Mappa decket ligger i monteres slik at de
      # relative stiene til figures/ og fonts/ i theme.css stemmer.
      #
      # PDF og HTML bygges fra SAMME fil, slides.md, så de viser det samme.
      # Decket hadde to utgaver før — YouTube-embed i HTML, stillbilder i PDF,
      # fordi ingen PDF-viser utenom Adobe Acrobat spiller video — og et
      # mellomsteg (inject_film.py) som byttet slidene om. Videoen er tatt ut,
      # og det maskineriet er borte.
      #
      # Alt som trengs er sjekket inn: bildene, Inter og KaTeX-fontene. Bygget
      # gjør ingen nettkall, og trenger verken ffmpeg eller preprosessering.
      # To decks bygges fra samme tema og de samme figurene:
      #
      #   women-engineering-forma/  engelsk, 17.11.2026     — publiseres på /
      #   jenter-i-ai/              Jenter i AI, 24.09.2026 — publiseres på /jenter-i-ai/
      #
      # women-engineering-forma/figures, fonts og theme.css er symlenker til
      # jenter-i-ai/. Derfor monteres hele repoet (ikke bare én katalog) for det
      # engelske decket, så lenkene peker innenfor containeren.
      - name: Bygg engelsk deck (women-engineering-forma)
        run: |
          for fmt in html pdf; do
            if [ "$fmt" = pdf ]; then out=slides.pdf; flag=--pdf; else out=index.html; flag=; fi
            docker run --rm \
              -v "$PWD":/home/marp/app \
              -e MARP_USER="$(id -u):$(id -g)" \
              -e LANG=C.UTF-8 \
              marpteam/marp-cli:v3.2.0 \
              --theme women-engineering-forma/theme.css --allow-local-files --html \
              women-engineering-forma/slides.md $flag -o women-engineering-forma/$out
          done

      - name: Bygg norsk deck (jenter-i-ai)
        run: |
          for fmt in html pdf; do
            if [ "$fmt" = pdf ]; then out=slides.pdf; flag=--pdf; else out=index.html; flag=; fi
            docker run --rm \
              -v "$PWD/jenter-i-ai":/home/marp/app \
              -e MARP_USER="$(id -u):$(id -g)" \
              -e LANG=C.UTF-8 \
              marpteam/marp-cli:v3.2.0 \
              --theme theme.css --allow-local-files --html slides.md $flag -o $out
          done

      - name: Sett sammen nettstedet
        run: |
          mkdir -p _site/jenter-i-ai
          # Engelsk på rota
          mv women-engineering-forma/index.html _site/index.html
          mv women-engineering-forma/slides.pdf _site/slides.pdf
          cp -R jenter-i-ai/figures _site/figures
          cp -R jenter-i-ai/fonts   _site/fonts
          # Norsk under /jenter-i-ai/. Figurene kopieres en gang til, fordi
          # HTML-en peker på figures/ relativt til seg selv.
          mv jenter-i-ai/index.html _site/jenter-i-ai/index.html
          mv jenter-i-ai/slides.pdf _site/jenter-i-ai/slides.pdf
          cp -R jenter-i-ai/figures _site/jenter-i-ai/figures
          cp -R jenter-i-ai/fonts   _site/jenter-i-ai/fonts
          # Uten denne kjører GitHub Pages innholdet gjennom Jekyll.
          touch _site/.nojekyll
          echo "Bygget:"; find _site -type f -not -path '*/figures/*' | sort

      # Gjør resultatet nedlastbart fra kjøringen — også for pull requests,
      # der vi ikke publiserer.
      - name: Last opp som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: _site
          retention-days: 14

      - name: Publiser til gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q
          git checkout -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publiser slides fra ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
